<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přesný čas a světová časová pásma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace, sans-serif;
        }

        /* Seznam světových měst na středu obrazovky */
        #worldClocks {
            color: #00FF00;
            font-size: 1.2vh; /* Poloviční velikost oproti přesnému času (2.4vh -> 1.2vh) */
            font-weight: normal; /* Poloviční / normální tloušťka */
            letter-spacing: 1px;
            text-shadow: 0 0 3px rgba(0, 255, 0, 0.5);
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
            line-height: 1.4;
            padding: 10px;
        }

        .city-row {
            margin: 2px 0;
            white-space: nowrap;
        }

        /* Kontejner v pravém dolním rohu pro čas a počítadlo */
        #bottomRightContainer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        /* Hlavní přesný čas v pravém dolním rohu */
        #clock {
            color: #00FF00;
            font-size: 2.4vh;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        /* Počítadlo přístupů pod časem */
        #visitCounter {
            color: #00FF00;
            font-size: 1.2vh;
            font-weight: normal;
            letter-spacing: 1px;
            opacity: 0.8;
            text-shadow: 0 0 3px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Seznam světových měst na středu obrazovky -->
    <div id="worldClocks"></div>

    <!-- Přesný čas a počítadlo v pravém dolním rohu -->
    <div id="bottomRightContainer">
        <div id="clock">--:--:--</div>
        <div id="visitCounter">Návštěvy: --</div>
    </div>

    <script>
        const clockElement = document.getElementById('clock');
        const counterElement = document.getElementById('visitCounter');
        const worldClocksElement = document.getElementById('worldClocks');
        let timeOffset = 0; // Odchylka lokálního času od serverového v ms

        // Seznam 24 reprezentativních měst pro časová pásma (UTC-11 až UTC+12)
        const timezones = [
            { city: "Pago Pago (Midway)", zone: "Pacific/Pago_Pago" },          // UTC-11
            { city: "Honolulu (Havaj)", zone: "Pacific/Honolulu" },             // UTC-10
            { city: "Anchorage (Aljaška)", zone: "America/Anchorage" },        // UTC-9
            { city: "Los Angeles (PTP)", zone: "America/Los_Angeles" },        // UTC-8
            { city: "Denver (MST)", zone: "America/Denver" },                   // UTC-7
            { city: "Chicago (CST)", zone: "America/Chicago" },                 // UTC-6
            { city: "New York (EST)", zone: "America/New_York" },               // UTC-5
            { city: "Santiago (Chile)", zone: "America/Santiago" },             // UTC-4
            { city: "Buenos Aires", zone: "America/Argentina/Buenos_Aires" },  // UTC-3
            { city: "Noronha (Brazílie)", zone: "America/Noronha" },            // UTC-2
            { city: "Ponta Delgada (Azory)", zone: "Atlantic/Azores" },         // UTC-1
            { city: "Londýn (UTC/GMT)", zone: "Europe/London" },                // UTC+0
            { city: "Praha / Paříž (CET)", zone: "Europe/Prague" },             // UTC+1
            { city: "Káhira / Athény (EET)", zone: "Africa/Cairo" },            // UTC+2
            { city: "Moskva / Rijád", zone: "Europe/Moscow" },                  // UTC+3
            { city: "Dubaj (GST)", zone: "Asia/Dubai" },                        // UTC+4
            { city: "Karáčí (PKT)", zone: "Asia/Karachi" },                     // UTC+5
            { city: "Dháka (BST)", zone: "Asia/Dhaka" },                        // UTC+6
            { city: "Bangkok (ICT)", zone: "Asia/Bangkok" },                    // UTC+7
            { city: "Peking / Singapur", zone: "Asia/Shanghai" },               // UTC+8
            { city: "Tokio (JST)", zone: "Asia/Tokyo" },                        // UTC+9
            { city: "Sydney (AEST)", zone: "Australia/Sydney" },                // UTC+10
            { city: "Nouméa (Nová Kaledonie)", zone: "Pacific/Noumea" },        // UTC+11
            { city: "Auckland (Nový Zéland)", zone: "Pacific/Auckland" }        // UTC+12
        ];

        // Funkce pro načtení a započítání návštěvy
        async function updateVisitCount() {
            try {
                const response = await fetch('https://api.countapi.xyz/hit/presnycas-hodiny-page/visits');
                if (response.ok) {
                    const data = await response.json();
                    counterElement.textContent = `Návštěvy: ${data.value}`;
                } else {
                    counterElement.textContent = `Návštěvy: 1`;
                }
            } catch (error) {
                let localVisits = parseInt(localStorage.getItem('page_visits') || '0') + 1;
                localStorage.setItem('page_visits', localVisits);
                counterElement.textContent = `Návštěvy: ${localVisits}`;
            }
        }

        // Funkce pro získání přesného času ze serveru presnycas.cz
        async function syncServerTime() {
            try {
                const startTime = Date.now();
                const response = await fetch('https://www.presnycas.cz/api/time');
                const endTime = Date.now();
                
                if (response.ok) {
                    const data = await response.json();
                    const roundTripTime = (endTime - startTime) / 2;
                    const serverTimestamp = data.timestamp + roundTripTime;
                    timeOffset = serverTimestamp - Date.now();
                }
            } catch (error) {
                console.warn('Nepodařilo se synchronizovat se serverem presnycas.cz, používá se lokální čas.', error);
            }
        }

        // Funkce pro aktualizaci zobrazení hodin a všech světových měst
        function updateClock() {
            // Aktuální čas korigovaný o odchylku serveru
            const now = new Date(Date.now() + timeOffset);

            // Aktualizace místního přesného času v rohu
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockElement.textContent = `${hours}:${minutes}:${seconds}`;

            // Aktualizace 24 světových měst
            let worldClocksHTML = '';
            
            timezones.forEach(tz => {
                try {
                    // Formátování času pro dané časové pásmo
                    const formatter = new Intl.DateTimeFormat('cs-CZ', {
                        timeZone: tz.zone,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    });

                    const timeString = formatter.format(now);
                    worldClocksHTML += `<div class="city-row">${tz.city.padEnd(30, '.')} ${timeString}</div>`;
                } catch (e) {
                    // Záložní výpis při chybě časové zóny
                    worldClocksHTML += `<div class="city-row">${tz.city}: --:--:--</div>`;
                }
            });

            worldClocksElement.innerHTML = worldClocksHTML;
        }

        // Spuštění inicializace
        updateVisitCount();
        syncServerTime();

        // Pravidelná resynchronizace každých 5 minut
        setInterval(syncServerTime, 5 * 60 * 1000);

        // Aktualizace zobrazení každou sekundu
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
