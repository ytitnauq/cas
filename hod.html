<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přesný čas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace, sans-serif;
        }

        /* Hlavní hodiny uprostřed */
        #clock {
            color: #00FF00;
            font-size: 2.4vh; /* Výška písma 0.2x původní hodnota 12vh */
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        /* Počítadlo přístupů v pravém dolním rohu */
        #visitCounter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #00FF00;
            font-size: 2.4vh; /* Stejná velikost písma jako u hodin */
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Hodiny uprostřed -->
    <div id="clock">--:--:--</div>

    <!-- Počítadlo přístupů v pravém dolním rohu -->
    <div id="visitCounter">Návštěvy: --</div>

    <script>
        const clockElement = document.getElementById('clock');
        const counterElement = document.getElementById('visitCounter');
        let timeOffset = 0; // Odchylka lokálního času od serverového v ms

        // Funkce pro načtení a započítání návštěvy (Počítadlo přístupů)
        async function updateVisitCount() {
            try {
                // Použije unikátní klíč podle domény/stránky, při každém načtení přičte 1
                const response = await fetch('https://api.countapi.xyz/hit/presnycas-hodiny-page/visits');
                if (response.ok) {
                    const data = await response.json();
                    counterElement.textContent = `Návštěvy: ${data.value}`;
                } else {
                    counterElement.textContent = `Návštěvy: 1`;
                }
            } catch (error) {
                // Náhradní řešení při výpadku služby API (využívá lokální uložení v prohlížeči)
                let localVisits = parseInt(localStorage.getItem('page_visits') || '0') + 1;
                localStorage.setItem('page_visits', localVisits);
                counterElement.textContent = `Návštěvy: ${localVisits}`;
            }
        }

        // Funkce pro získání přesného času ze serveru presnycas.cz
        async function syncServerTime() {
            try {
                const startTime = Date.now();
                const response = await fetch('https://www.presnycas.cz/api/time');
                const endTime = Date.now();
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Výpočet zpoždění sítě (network latency / round-trip time)
                    const roundTripTime = (endTime - startTime) / 2;
                    const serverTimestamp = data.timestamp + roundTripTime;
                    
                    // Výpočet odchylky lokálního času zařízení od serverového času
                    timeOffset = serverTimestamp - Date.now();
                }
            } catch (error) {
                console.warn('Nepodařilo se synchronizovat se serverem presnycas.cz, používá se lokální čas.', error);
            }
        }

        // Funkce pro aktualizaci zobrazení hodin
        function updateClock() {
            // Aktuální čas korigovaný o odchylku serveru
            const now = new Date(Date.now() + timeOffset);

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            clockElement.textContent = `${hours}:${minutes}:${seconds}`;
        }

        // Spuštění inicializace
        updateVisitCount();
        syncServerTime();

        // Pravidelná resynchronizace času se serverem každých 5 minut
        setInterval(syncServerTime, 5 * 60 * 1000);

        // Aktualizace zobrazení hodin každou sekundu
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
