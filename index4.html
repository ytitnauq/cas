<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přesný čas a světová pásma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace, sans-serif;
        }

        /* Kontejner pro tabulku světových časů na středu */
        #world-clocks {
            display: table;
            border-collapse: separate;
            border-spacing: 15px 2px;
            color: #00FF00;
            font-size: 1.2vh; /* Poloviční velikost oproti 2.4vh */
            font-weight: normal; /* Poloviční tloušťka */
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .clock-row {
            display: table-row;
        }

        .city-cell, .currency-cell, .time-cell {
            display: table-cell;
            padding: 1px 5px;
        }

        .city-cell {
            text-align: left;
        }

        .currency-cell {
            text-align: left;
        }

        .time-cell {
            text-align: right;
        }

        /* Kontejner v pravém dolním rohu pro čas a návštěvy */
        #bottom-right-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            color: #00FF00;
            font-size: 2.4vh;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Světová města na středu v přehledných sloupcích -->
    <div id="world-clocks"></div>

    <!-- Přesný čas a návštěvy v pravém dolním rohu -->
    <div id="bottom-right-container">
        <div id="visitCounter">Návštěvy: --</div>
        <div id="clock">--:--:--</div>
    </div>

    <script>
        const clockElement = document.getElementById('clock');
        const counterElement = document.getElementById('visitCounter');
        const worldClocksElement = document.getElementById('world-clocks');
        let timeOffset = 0; // Odchylka lokálního času od serverového v ms

        // Seznam 24 světových měst, časových posunů, měn a kurzů k EUR
        const timeZones = [
            { city: 'Pago Pago', offset: -11, currency: 'USD ($1 = 0.92 EUR)' },
            { city: 'Honolulu', offset: -10, currency: 'USD ($1 = 0.92 EUR)' },
            { city: 'Anchorage', offset: -8, currency: 'USD ($1 = 0.92 EUR)' },
            { city: 'Los Angeles', offset: -7, currency: 'USD ($1 = 0.92 EUR)' },
            { city: 'Denver', offset: -6, currency: 'USD ($1 = 0.92 EUR)' },
            { city: 'Chicago', offset: -5, currency: 'USD ($1 = 0.92 EUR)' },
            { city: 'New York', offset: -4, currency: 'USD ($1 = 0.92 EUR)' },
            { city: 'Santiago', offset: -3, currency: 'CLP (1000 CLP = 0.98 EUR)' },
            { city: 'Rio de Janeiro', offset: -3, currency: 'BRL (1 BRL = 0.16 EUR)' },
            { city: 'Fernando de Noronha', offset: -2, currency: 'BRL (1 BRL = 0.16 EUR)' },
            { city: 'Praia (Kapverdy)', offset: -1, currency: 'CVE (100 CVE = 0.91 EUR)' },
            { city: 'Londýn', offset: 0, currency: 'GBP (£1 = 1.19 EUR)' },
            { city: 'Paříž / Praha', offset: 2, currency: 'EUR / CZK (1 EUR = 25.10 CZK)' },
            { city: 'Atény / Káhira', offset: 3, currency: 'EUR / EGP (100 EGP = 1.90 EUR)' },
            { city: 'Dubaj', offset: 4, currency: 'AED (1 AED = 0.25 EUR)' },
            { city: 'Karáčí', offset: 5, currency: 'PKR (100 PKR = 0.33 EUR)' },
            { city: 'Dháka', offset: 6, currency: 'BDT (100 BDT = 0.77 EUR)' },
            { city: 'Bangkok', offset: 7, currency: 'THB (100 THB = 2.75 EUR)' },
            { city: 'Peking / Singapur', offset: 8, currency: 'CNY (1 CNY = 0.13 EUR)' },
            { city: 'Tokio', offset: 9, currency: 'JPY (100 JPY = 0.62 EUR)' },
            { city: 'Sydney', offset: 10, currency: 'AUD ($1 = 0.61 EUR)' },
            { city: 'Nouméa', offset: 11, currency: 'XPF (100 XPF = 0.84 EUR)' },
            { city: 'Auckland', offset: 12, currency: 'NZD ($1 = 0.56 EUR)' },
            { city: 'Tongatapu', offset: 13, currency: 'TOP (1 TOP = 0.39 EUR)' }
        ];

        // Inicializace řádků tabulky
        function initWorldClocks() {
            worldClocksElement.innerHTML = '';
            timeZones.forEach((tz, index) => {
                const row = document.createElement('div');
                row.className = 'clock-row';
                
                const cityCell = document.createElement('div');
                cityCell.className = 'city-cell';
                cityCell.textContent = tz.city;

                const currencyCell = document.createElement('div');
                currencyCell.className = 'currency-cell';
                currencyCell.textContent = tz.currency;

                const timeCell = document.createElement('div');
                timeCell.className = 'time-cell';
                timeCell.id = `tz-time-${index}`;
                timeCell.textContent = '--:--:--';

                row.appendChild(cityCell);
                row.appendChild(currencyCell);
                row.appendChild(timeCell);
                worldClocksElement.appendChild(row);
            });
        }

        // Funkce pro načtení a započítání návštěvy
        async function updateVisitCount() {
            try {
                const response = await fetch('https://api.countapi.xyz/hit/presnycas-hodiny-page/visits');
                if (response.ok) {
                    const data = await response.json();
                    counterElement.textContent = `Návštěvy: ${data.value}`;
                } else {
                    counterElement.textContent = `Návštěvy: 1`;
                }
            } catch (error) {
                let localVisits = parseInt(localStorage.getItem('page_visits') || '0') + 1;
                localStorage.setItem('page_visits', localVisits);
                counterElement.textContent = `Návštěvy: ${localVisits}`;
            }
        }

        // Funkce pro synchronizaci času
        async function syncServerTime() {
            try {
                const startTime = Date.now();
                const response = await fetch('https://www.presnycas.cz/api/time');
                const endTime = Date.now();
                
                if (response.ok) {
                    const data = await response.json();
                    const roundTripTime = (endTime - startTime) / 2;
                    const serverTimestamp = data.timestamp + roundTripTime;
                    timeOffset = serverTimestamp - Date.now();
                }
            } catch (error) {
                console.warn('Nepodařilo se synchronizovat se serverem presnycas.cz, používá se lokální čas.', error);
            }
        }

        // Aktualizace všech hodin
        function updateClock() {
            const nowUtc = new Date(Date.now() + timeOffset);

            // Hlavní přesný čas (lokální čas zařízení po korekci)
            const hours = String(nowUtc.getHours()).padStart(2, '0');
            const minutes = String(nowUtc.getMinutes()).padStart(2, '0');
            const seconds = String(nowUtc.getSeconds()).padStart(2, '0');
            clockElement.textContent = `${hours}:${minutes}:${seconds}`;

            // Světová časová pásma
            const utcTime = nowUtc.getTime() + (nowUtc.getTimezoneOffset() * 60000);
            
            timeZones.forEach((tz, index) => {
                const targetTime = new Date(utcTime + (3600000 * tz.offset));
                const zHours = String(targetTime.getHours()).padStart(2, '0');
                const zMinutes = String(targetTime.getMinutes()).padStart(2, '0');
                const zSeconds = String(targetTime.getSeconds()).padStart(2, '0');
                
                const timeCell = document.getElementById(`tz-time-${index}`);
                if (timeCell) {
                    timeCell.textContent = `${zHours}:${zMinutes}:${zSeconds}`;
                }
            });
        }

        // Spuštění
        initWorldClocks();
        updateVisitCount();
        syncServerTime();

        setInterval(syncServerTime, 5 * 60 * 1000);
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
